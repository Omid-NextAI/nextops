# CANDIDATE ONLY: qualify exact bytes, semantics, latency and rollback before installation.
# Replaces the serving 35B model-selection drop-in, not an additional parallel model.
# All native unit sandbox, loopback-only network, credentials and resource limits are inherited.
[Unit]
ConditionPathExists=
ConditionPathExists=/srv/nextops/models/current/Qwen_Qwen3.5-35B-A3B-Q4_K_M.gguf

[Service]
ExecStart=
ExecStart=/srv/nextops/runtime/llama.cpp/current/bin/llama-server \
    --model /srv/nextops/models/current/Qwen_Qwen3.5-35B-A3B-Q4_K_M.gguf \
    --alias nextops-qwen3-5-35b-a3b-q4-k-m \
    --host 127.0.0.1 \
    --port 8080 \
    --api-key-file %d/llama-api-key \
    --threads 16 \
    --threads-batch 16 \
    --threads-http 2 \
    --ctx-size 16384 \
    --batch-size 512 \
    --ubatch-size 128 \
    --parallel 1 \
    --gpu-layers 0 \
    --flash-attn off \
    --no-context-shift \
    --no-webui \
    --no-slots \
    --metrics \
    --chat-template-kwargs '{"enable_thinking":false}' \
    --reasoning-format deepseek \
    --reasoning-budget 384 \
    --no-reasoning-preserve
