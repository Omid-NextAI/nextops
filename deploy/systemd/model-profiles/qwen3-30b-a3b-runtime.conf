# Install only after exact artifact and bilingual qualification; retain the 8B profile.
# All resource, credential and network restrictions are inherited unchanged.
[Unit]
ConditionPathExists=
ConditionPathExists=/srv/nextops/models/current/Qwen3-30B-A3B-Q4_K_M.gguf

[Service]
ExecStart=
ExecStart=/srv/nextops/runtime/llama.cpp/current/bin/llama-server \
    --model /srv/nextops/models/current/Qwen3-30B-A3B-Q4_K_M.gguf \
    --alias nextops-qwen3-30b-a3b-q4-k-m \
    --host 127.0.0.1 \
    --port 8080 \
    --api-key-file %d/llama-api-key \
    --threads 16 \
    --threads-batch 16 \
    --threads-http 2 \
    --ctx-size 8192 \
    --batch-size 512 \
    --ubatch-size 128 \
    --parallel 1 \
    --gpu-layers 0 \
    --flash-attn off \
    --no-context-shift \
    --no-webui \
    --no-slots \
    --metrics
